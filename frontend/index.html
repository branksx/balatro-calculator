<!DOCTYPE html>
<html lang="pt-BR">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balatro Hand Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>🃏 Balatro Hand Calculator</h1>
        <p>Calculadora de pontuações de mão de balatro!</p>
        <div class="card">
            <div class="input-group">
                <label for="handSelect">Escolha sua Mão:</label>
                <select id="handSelect">
                    <option value="">A carregar mãos...</option>
                </select>
            </div>

            <div class="input-group">
                <label for="levelInput">Nível da Mão:</label>
                <input type="number" id="levelInput" value="1" min="1">
            </div>

            <button id="calculateButton">Calcular Pontuação</button>
        </div>

        <div id="resultCard" class="result-card hidden">
            <h2>Resultado:</h2>
            <p><strong> Mão: </strong><span id="resHandName"></span></p>
            <p><strong> Nível: </strong><span id="resHandLevel"></span></p>
            <p><strong> Chips: </strong><span id="resChips"></span></p>
            <p><strong> Multi: </strong><span id="resMulti"></span></p>
            <p class="score-display"><strong> Pontuação: </strong><span id="resScore"></span></p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
